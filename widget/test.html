<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura — Next Gen Spatial Audio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #08080a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow-x: hidden;
    }

    /* 3D Canvas Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Overlay Content */
    .content {
      position: relative;
      z-index: 2;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 5%;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links a {
      color: #888;
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .hero {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 5%;
      max-width: 700px;
    }

    .hero h1 {
      font-size: clamp(3rem, 7vw, 5.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 1.5rem;
      background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.15rem;
      color: #8a8a93;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      max-width: 500px;
    }

    .cta-btn {
      display: inline-block;
      width: fit-content;
      padding: 1rem 2.2rem;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-weight: 600;
      border-radius: 99px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <main class="content">
    <nav>
      <div class="logo">AURA</div>
      <div class="nav-links">
        <a href="#features">Features</a>
        <a href="#specs">Specs</a>
        <a href="#buy">Order</a>
      </div>
    </nav>

    <section class="hero">
      <h1>Sound rendered in 3 dimensions.</h1>
      <p>Experience ultra-fidelity spatial audio that moves around you in real time. Powered by custom acoustic hardware.</p>
      <a href="#" class="cta-btn">Explore Aura</a>
    </section>
  </main>

  <script>
    // --- 1. Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // --- 2. 3D Object (Icosahedron / Knot) ---
    const geometry = new THREE.IcosahedronGeometry(1.5, 0);
    
    // Glassy / Metallic material
    const material = new THREE.MeshPhysicalMaterial({
      color: 0x2233ff,
      emissive: 0x050515,
      roughness: 0.1,
      metalness: 0.8,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      wireframe: false,
    });

    const mainObject = new THREE.Mesh(geometry, material);
    mainObject.position.set(1.5, 0, 0); // Positioned to the right side of hero text
    scene.add(mainObject);

    // Wireframe overlay for a tech aesthetic
    const wireframeGeo = new THREE.WireframeGeometry(geometry);
    const wireframeMat = new THREE.LineBasicMaterial({ color: 0x88bbff, transparent: true, opacity: 0.3 });
    const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
    mainObject.add(wireframe);

    // --- 3. Background Particle Field ---
    const particlesGeo = new THREE.BufferGeometry();
    const particleCount = 400;
    const posArray = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 15;
    }

    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMat = new THREE.PointsMaterial({
      size: 0.02,
      color: 0xffffff,
      transparent: true,
      opacity: 0.5
    });

    const particleMesh = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particleMesh);

    // --- 4. Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x00aaff, 2, 50);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    const pointLight2 = new THREE.PointLight(0xff0055, 1.5, 50);
    pointLight2.position.set(-5, -5, -2);
    scene.add(pointLight2);

    // --- 5. Mouse Parallax Effect ---
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5);
      mouseY = (e.clientY / window.innerHeight - 0.5);
    });

    // --- 6. Responsive Handling ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Adjust 3D object placement for mobile vs desktop
      if (window.innerWidth < 768) {
        mainObject.position.set(0, -1, 0);
      } else {
        mainObject.position.set(1.5, 0, 0);
      }
    });

    // Initial check for mobile layout
    if (window.innerWidth < 768) {
      mainObject.position.set(0, -1, 0);
    }

    // --- 7. Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Continuous object rotation
      mainObject.rotation.y = elapsedTime * 0.3;
      mainObject.rotation.x = elapsedTime * 0.2;

      // Gentle floating motion
      mainObject.position.y += Math.sin(elapsedTime * 1.5) * 0.002;

      // Parallax mouse movement smoothing (Lerp)
      targetX = mouseX * 0.5;
      targetY = mouseY * 0.5;

      camera.position.x += (targetX - camera.position.x) * 0.05;
      camera.position.y += (-targetY - camera.position.y) * 0.05;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
