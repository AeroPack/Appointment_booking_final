name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

permissions:
  contents: read
  packages: write

jobs:
  # ── PR validation & pre-merge checks ──────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── Backend ──
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Backend typecheck
        run: npx tsc --noEmit
        working-directory: backend

      - name: Backend build
        run: npm run build
        working-directory: backend

      # ── Frontend ──
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

  # ── Build Docker images and push to GHCR ──────────────────────────────────
  build-and-push:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image ──
      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # ── Frontend image ──
      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  # ── Deploy to VPS via SSH ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Copy the rollout script to the VPS
      - name: Copy deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/rollout.sh"
          target: /opt/appointment_booking

      # Run the rollout script, passing all secrets as env vars
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:latest
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:latest
          DATABASE_URL: "postgresql://postgres:${{ secrets.DB_PASSWORD }}@new_project_db:5432/appointment_booking"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WA_PROVIDER: ${{ secrets.WA_PROVIDER }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          EVO_SYSTEM_INSTANCE: ${{ secrets.EVO_SYSTEM_INSTANCE }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          WA_AUTH_TEMPLATE: ${{ secrets.WA_AUTH_TEMPLATE }}
          WA_GATEWAY_URL: ${{ secrets.WA_GATEWAY_URL }}
          WA_GATEWAY_USER: ${{ secrets.WA_GATEWAY_USER }}
          WA_GATEWAY_PASS: ${{ secrets.WA_GATEWAY_PASS }}
          WA_GATEWAY_SENDER: ${{ secrets.WA_GATEWAY_SENDER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: "BACKEND_IMAGE,FRONTEND_IMAGE,DATABASE_URL,JWT_SECRET,GEMINI_API_KEY,WA_PROVIDER,EVOLUTION_API_URL,EVOLUTION_API_KEY,BACKEND_URL,EVO_SYSTEM_INSTANCE,EMAIL_HOST,EMAIL_PORT,EMAIL_SECURE,EMAIL_USERNAME,EMAIL_PASSWORD,WA_AUTH_TEMPLATE,WA_GATEWAY_URL,WA_GATEWAY_USER,WA_GATEWAY_PASS,WA_GATEWAY_SENDER,DB_PASSWORD"
          script: |
            set -euo pipefail
            cd /opt/appointment_booking
            chmod +x deploy/rollout.sh
            bash deploy/rollout.sh
